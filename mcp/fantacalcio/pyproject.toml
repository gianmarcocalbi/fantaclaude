[project]
name = "fantacalcio-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gianmarco Calbi", email = "calbigianmarco@gmail.com" }
]
requires-python = ">=3.14.7"
dependencies = [
    "fastmcp>=3.4.7",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]

[project.scripts]
fantacalcio-mcp = "fantacalcio_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = true
