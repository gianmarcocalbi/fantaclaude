# league.yml -- only what the league API cannot express. Never override what
# it can: a key that duplicates an API value must agree with it, or
# `fantaclaude sync-league` fails loud (exit 4). Every leaf carries
# value / source / verified_on (an ISO date); `note` is optional.
auction:
  platform:
    value: FantaAstaLive
    source: admin
    verified_on: 2026-08-23
  mode:
    value: rilanci        # draft | rilanci
    source: admin
    verified_on: 2026-09-02
    note: >-
      A RILANCI, confirmed by the admin. Anyone bids at any time and the lot
      goes to the last offer when the countdown expires. The 2026-08-23 capture
      shows the parameters FantaAstaLive uses for it -- countdownSeconds 10,
      countdownInterval 2000, countdownType auction, minimumBid fixed 1,
      beatRaise 1 -- but nothing in this repo reads a live bid: the board shows
      the modelled band and modelled pressure, never the current offer. Watch
      the offer on FantaAstaLive itself and the max price here (open question 10).
  date:
    value: 2026-09-03
    source: admin
    verified_on: 2026-09-02
    note: >-
      Confirmed 2026-09-02 as the next day. The earlier 2026-09-05 was the
      admin's approximate date and was wrong by two days, which collapsed the
      freeze: there is no separate freeze day, the run is pinned the evening
      before. Giornata 3 kicks off 2026-09-04 18:45, i.e. AFTER the auction,
      so the pinned run's "giornata 2 played, 36 remaining" is correct for
      once -- the auction precedes the round rather than trailing it.
roster:
  min_goalkeepers:
    value: 2
    source: admin
    verified_on: 2026-08-24
    note: stated verbally; equals the API's minrl[0], and the cross-check keeps it that way
